    <rect x="150" y="214" width="212" height="170" rx="12" fill="#ffffff"/>
    <rect x="182" y="246" width="148" height="15" rx="7.5" fill="#93c5fd"/>
    <rect x="182" y="278" width="148" height="15" rx="7.5" fill="#93c5fd"/>
    <path fill="#ffffff" stroke="#ffffff" stroke-width="28" stroke-linejoin="round"
          d="M80 306 L442 306 L414 400 L58 400 Z"/>
  </g>
